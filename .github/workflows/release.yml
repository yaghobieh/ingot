# Desktop release pipeline (IDEA-134). Push a tag like v0.1.0-beta.1 to build every installer and attach them to a
# DRAFT GitHub Release (marked pre-release when the tag has a "-"). Nothing is public until the draft is published.
# Signing is optional: each step switches on only when its secrets exist (see docs/release.md for the names).
name: Release

on:
  push:
    tags: ['v*']
  # Manual run: builds the installers as workflow artifacts only (no GitHub Release).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            args: --mac --arm64
          - name: macOS x64
            os: macos-15-intel
            args: --mac --x64
          - name: Windows x64
            os: windows-latest
            args: --win --x64
          - name: Linux x64
            os: ubuntu-latest
            args: --linux --x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: System deps for native modules
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libxkbfile-dev
      - run: npm ci
      - run: npm run build:electron
      - name: Package installers
        shell: bash
        env:
          # All optional; each OS signs only when its own secrets exist, otherwise the installers are unsigned.
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Public URLs baked into the app (Actions *variables*, not secrets). Unset -> the app keeps localhost (dev).
          INGOT_SERVER_URL: ${{ vars.INGOT_SERVER_URL }}
          INGOT_PORTAL_URL: ${{ vars.INGOT_PORTAL_URL }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$MAC_CSC_LINK" ]; then
            export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"
            echo "Signing the macOS app with the Developer ID certificate."
          elif [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_CSC_LINK" ]; then
            export WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            echo "Signing the Windows installer."
          else
            unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "No signing secrets for $RUNNER_OS: building UNSIGNED installers."
          fi
          EXTRA=()
          # Unsigned macOS builds are ad-hoc signed, so Gatekeeper offers "Open Anyway" instead of "damaged".
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "$CSC_LINK" ]; then EXTRA+=("-c.mac.identity=-"); fi
          unset MAC_CSC_LINK MAC_CSC_KEY_PASSWORD
          if [ "$RUNNER_OS" != "macOS" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$CSC_LINK" ]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            if [ "$RUNNER_OS" = "macOS" ]; then echo "Notarization off (needs the certificate and all three Apple secrets)."; fi
          fi
          # Tag v0.1.0-beta.1 -> app version 0.1.0-beta.1 (drives the installer names and the update channel).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then EXTRA+=("-c.extraMetadata.version=${GITHUB_REF_NAME#v}"); fi
          if [ -n "$INGOT_SERVER_URL" ]; then EXTRA+=("-c.extraMetadata.ingotEndpoints.serverUrl=$INGOT_SERVER_URL"); fi
          if [ -n "$INGOT_PORTAL_URL" ]; then EXTRA+=("-c.extraMetadata.ingotEndpoints.portalUrl=$INGOT_PORTAL_URL"); fi
          if [ -z "$INGOT_SERVER_URL" ] || [ -z "$INGOT_PORTAL_URL" ]; then
            echo "::warning::INGOT_SERVER_URL / INGOT_PORTAL_URL repository variables are not set: this build points at localhost."
          fi
          npm run package:electron -- ${{ matrix.args }} "${EXTRA[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}-${{ runner.arch }}
          if-no-files-found: error
          retention-days: 14
          path: |
            applications/electron/dist/*.dmg
            applications/electron/dist/*.zip
            applications/electron/dist/*.exe
            applications/electron/dist/*.AppImage
            applications/electron/dist/*.deb
            applications/electron/dist/*.blockmap
            applications/electron/dist/latest*.yml

  release:
    name: Draft GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Merge the two macOS update feeds into one latest-mac.yml
        run: |
          node scripts/merge-latest-mac.mjs artifacts/installers-macOS-ARM64/latest-mac.yml artifacts/installers-macOS-X64/latest-mac.yml > latest-mac.yml
          rm -f artifacts/*/latest-mac.yml
          mkdir -p upload && find artifacts -type f -exec cp {} upload/ \; && mv latest-mac.yml upload/
          ls -la upload
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: Ingot ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: upload/*
