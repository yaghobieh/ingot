name: Portal

on:
  push:
    branches: [master, 'release/**']
    paths: ['apps/portal/**', '.github/workflows/portal.yml', 'assets/brand/**']
  pull_request:
    paths: ['apps/portal/**', '.github/workflows/portal.yml', 'assets/brand/**']

concurrency:
  group: portal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    name: Portal (gate, build, e2e light + dark)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/portal
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ingot
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: ingot_portal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ingot" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://ingot:ci-throwaway@localhost:5432/ingot_portal_test
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - run: npm ci
      - run: npm run secret-scan
      - run: npm run gate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-playwright
          path: |
            apps/portal/playwright-report
            apps/portal/test-results
          retention-days: 7
