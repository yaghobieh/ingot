name: CI

on:
  push:
    branches: [master, 'release/**']
  # All PRs, including PRs stacked on feature branches.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate (lint, typecheck, unit, secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: System deps for native modules
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libxkbfile-dev
      - run: npm ci
      - run: npm run secret-scan
      - run: npm run gate

  e2e:
    # Sharded: one long run (115+ tests on one backend) made the hosted runner shut down mid-run.
    name: Build browser app + Playwright e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: System deps for native modules
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev libxkbfile-dev
      - run: npm ci
      - run: npm run build:browser
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      # Call the e2e workspace directly so --shard reaches Playwright (through the root script npm swallowed it).
      - run: npm run test -w e2e -- --shard=${{ matrix.shard }}/3
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  electron-e2e:
    # IDEA-189: the desktop (Electron) e2e suite: native clipboard, menu roles, approvals, review bar, context ring.
    # The specs use the macOS keymap (Cmd), so they run on the macOS runner.
    name: Desktop app e2e (macos-latest)
    runs-on: macos-latest
    needs: gate
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:electron
      - run: npm run test:electron -w e2e
        env:
          CI: 'true'
          INGOT_SHOTS: ${{ github.workspace }}/e2e/electron-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-electron
          path: |
            e2e/playwright-report-electron
            e2e/test-results
            e2e/electron-shots
          retention-days: 7
          if-no-files-found: ignore

  electron:
    name: Build desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:electron
